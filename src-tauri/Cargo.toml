[package]
name = "osumosis-desktop"
version = "0.4.2"
description = "osu!mosis local companion"
authors = ["Debuzzz"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
